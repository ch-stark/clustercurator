apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: batch-trigger-cc-upgrades
  namespace: open-cluster-management-global-set
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: batch-trigger-clustercurator-upgrades
        spec:
          remediationAction: enforce
          severity: critical
          object-templates-raw: |
            {{- $targetVersion := "5.0.2" }}
            {{- $targetChannel := "candidate-5.1" }}

            {{- range $cluster := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items }}
              {{- $clusterName := $cluster.metadata.name }}
              {{- $currentVersion := (dig "status" "version" "openshift" "" $cluster) }}

              {{- if and (eq $clusterName "local-cluster") (ne $currentVersion "") (ne $currentVersion $targetVersion) }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta1
                kind: ClusterCurator
                metadata:
                  name: {{ $clusterName }}
                  namespace: {{ $clusterName }}
                  labels:
                    fleet.openshift.io/target-version: {{ $targetVersion }}
                spec:
                  desiredCuration: upgrade
                  upgrade:
                    desiredUpdate: {{ $targetVersion }}
                    channel: {{ $targetChannel }}
                    monitorTimeout: 120
              {{- end }}
            {{- end }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-batch-trigger-cc-upgrades
  namespace: open-cluster-management-global-set
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            name: local-cluster
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-batch-trigger-cc-upgrades
  namespace: open-cluster-management-global-set
placementRef:
  name: placement-batch-trigger-cc-upgrades
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: batch-trigger-cc-upgrades
    kind: Policy
    apiGroup: policy.open-cluster-management.io
