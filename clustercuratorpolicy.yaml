apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: batch-trigger-cc-upgrades
  namespace: open-cluster-management-global-set
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/description: "Safely triggers ClusterCurator upgrade once per cluster across the entire fleet."
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: batch-trigger-clustercurator-upgrades
        spec:
          remediationAction: enforce
          severity: critical
          evaluationInterval:
            compliant: 2m
            noncompliant: 30s
          object-templates-raw: |
            {{- $targetVersion := "5.0.2" }}
            {{- $targetChannel := "candidate-5.1" }}
            {{- $cv := (lookup "config.openshift.io/v1" "ClusterVersion" "" "version") }}
            {{- $currentVersion := (dig "status" "desired" "version" "" $cv) }}

            {{- /* Enforce upgrade on any fleet cluster whose current ClusterVersion != targetVersion */ -}}
            {{- if and (ne $currentVersion "") (ne $currentVersion $targetVersion) }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta1
                kind: ClusterCurator
                metadata:
                  name: {{ .ManagedClusterName }}
                  namespace: {{ .ManagedClusterName }}
                  labels:
                    fleet.openshift.io/target-version: {{ $targetVersion }}
                spec:
                  desiredCuration: upgrade
                  upgrade:
                    desiredUpdate: {{ $targetVersion }}
                    channel: {{ $targetChannel }}
                    monitorTimeout: 120
            {{- end }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: global
  namespace: open-cluster-management-global-set
spec:
  clusterSets:
    - global
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Equal
    - key: cluster.open-cluster-management.io/unavailable
      operator: Equal
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: batch-trigger-cc-upgrades-placement-binding
  namespace: open-cluster-management-global-set
placementRef:
  name: global
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: batch-trigger-cc-upgrades
    kind: Policy
    apiGroup: policy.open-cluster-management.io
