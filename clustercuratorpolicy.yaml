apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: batch-trigger-cc-upgrades
  namespace: open-cluster-management-global-set # Update to your Hub policy namespace if different
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: batch-trigger-clustercurator-upgrades
        spec:
          remediationAction: enforce
          severity: critical
          object-templates-raw: |
            {{- /* Define target release parameters */ -}}
            {{- $targetVersion := "5.0.2" }}
            {{- $targetChannel := "candidate-5.1" }}
            {{- $targetWave := "wave-1" }}

            {{- /* Query all ManagedClusters on the Hub matching the target wave */ -}}
            {{- range $cluster := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items }}
              {{- $labels := (dig "metadata" "labels" dict $cluster) }}
              {{- $clusterName := $cluster.metadata.name }}
              {{- $wave := (get $labels "upgrade-wave") }}
              {{- $currentVersion := (dig "status" "version" "openshift" "" $cluster) }}

              {{- /* Skip local-cluster, target only designated wave, and stop enforcing once upgraded */ -}}
              {{- if and (ne $clusterName "local-cluster") (eq $wave $targetWave) (ne $currentVersion "") (ne $currentVersion $targetVersion) }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta1
                kind: ClusterCurator
                metadata:
                  name: {{ $clusterName }}
                  namespace: {{ $clusterName }}
                  labels:
                    fleet.openshift.io/upgrade-wave: {{ $targetWave }}
                    fleet.openshift.io/target-version: {{ $targetVersion }}
                spec:
                  desiredCuration: upgrade
                  upgrade:
                    desiredUpdate: {{ $targetVersion }}
                    channel: {{ $targetChannel }}
                    monitorTimeout: 120
              {{- end }}
            {{- end }}
